apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: internet-monitor
resources: [namespace.yaml, prometheus.yaml, grafana.yaml]
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml, blackbox.yml]
  - name: grafana-provisioning
    files: [datasource.yaml, dashboards.yaml, internet-monitor.json]
